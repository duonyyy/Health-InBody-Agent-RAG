version: '3.8'

networks:
  internal-network:
    name: internal-network
    external: true

services:
  chatbot-api:
    build: .
    hostname: chatbot-api
    container_name: chatbot-api
    command: /bin/sh -c 'uvicorn api.app:app --host 0.0.0.0 --port 8000 --workers "$${API_WORKERS:-1}" --log-level info'
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=False
      - AUTH_MODE=${AUTH_MODE:-production}
      - ENABLE_LEGACY_USER_ENDPOINTS=${ENABLE_LEGACY_USER_ENDPOINTS:-false}
      - ENABLE_PERSONALIZATION_DEBUG=${ENABLE_PERSONALIZATION_DEBUG:-false}
      - REDIS_HOST=valkey-db
      - QDRANT_URL=http://qdrant-db:6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-nmk_chatbot_active}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-nmk_chatbot_active}
      - CORPUS_VERSION=${CORPUS_VERSION:-}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - OLLAMA_THINK=${OLLAMA_THINK:-auto}
      - API_WORKERS=${API_WORKERS:-1}
      - BM25_AUTOLOAD=${BM25_AUTOLOAD:-true}
      - BM25_SNAPSHOT_PATH=${BM25_SNAPSHOT_PATH:-/usr/src/app/data/generated/bm25_snapshot.json.gz}
      - FEATURE_OCR_UPLOAD=${FEATURE_OCR_UPLOAD:-false}
      - OCR_SERVICE_URL=http://ocr-api:18100
      - CUSTOM_EMBEDDING_API_URL=${CUSTOM_EMBEDDING_API_URL:-http://embedding-api:5000}
    volumes:
      - .:/usr/src/app/
    ports:
      - "8000:8000"
    networks:
      - internal-network

  chatbot-worker:
    build: .
    hostname: chatbot-worker
    container_name: chatbot-worker
    command: celery -A jobs.tasks.celery_app worker --loglevel=warning --logfile=/var/logs/celery.log
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=False
      - AUTH_MODE=${AUTH_MODE:-production}
      - ENABLE_LEGACY_USER_ENDPOINTS=${ENABLE_LEGACY_USER_ENDPOINTS:-false}
      - ENABLE_PERSONALIZATION_DEBUG=${ENABLE_PERSONALIZATION_DEBUG:-false}
      - REDIS_HOST=valkey-db
      - QDRANT_URL=http://qdrant-db:6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-nmk_chatbot_active}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-nmk_chatbot_active}
      - CORPUS_VERSION=${CORPUS_VERSION:-}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - OLLAMA_THINK=${OLLAMA_THINK:-auto}
    volumes:
      - .:/usr/src/app
      - worker_volume:/var/logs/
    networks:
      - internal-network

  chatbot-scheduler:
    build: .
    command: celery -A jobs.tasks.celery_app beat --schedule=/tmp/memory-celerybeat --loglevel=info
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=valkey-db
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in backend/.env}
    networks:
      - internal-network

volumes:
  worker_volume:
