version: '3.8'

networks:
  internal-network:
    name: internal-network

services:
  chatbot-api:
    build: .
    hostname: chatbot-api
    container_name: chatbot-api
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=False
      - REDIS_HOST=valkey-db
      - QDRANT_URL=http://qdrant-db:6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-nmk_chatbot_active}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-nmk_chatbot_active}
      - CORPUS_VERSION=${CORPUS_VERSION:-}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - OLLAMA_THINK=${OLLAMA_THINK:-auto}
    volumes:
      - .:/usr/src/app/
    ports:
      - 8000:8000
    depends_on:
      - valkey-db
      - qdrant-db
      - postgres-db
    networks:
      - internal-network

  chatbot-worker:
    build: .
    hostname: chatbot-worker
    container_name: chatbot-worker
    command: celery -A tasks.celery_app worker --loglevel=debug --logfile=/var/logs/celery.log
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=False
      - REDIS_HOST=valkey-db
      - QDRANT_URL=http://qdrant-db:6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-nmk_chatbot_active}
      - QDRANT_COLLECTION_ALIAS=${QDRANT_COLLECTION_ALIAS:-nmk_chatbot_active}
      - CORPUS_VERSION=${CORPUS_VERSION:-}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - OLLAMA_THINK=${OLLAMA_THINK:-auto}
    volumes:
      - .:/usr/src/app
      - worker_volume:/var/logs/
    depends_on:
      - valkey-db
      - qdrant-db
      - postgres-db
    networks:
      - internal-network

  valkey-db:
    image: 'valkey/valkey:bookworm'
    hostname: valkey-db
    container_name: valkey-db
    restart: always
    ports:
      - "6379:6379"
    command:
      - '--save 60 1'
    volumes:
      - valkey_data:/data
    networks:
      - internal-network

  qdrant-db:
    image: qdrant/qdrant:latest
    hostname: qdrant-db
    container_name: qdrant-db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant_volume:/qdrant/storage
    networks:
      - internal-network

  postgres-db:
    image: postgres:16-alpine
    hostname: postgres-db
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-health_inbody}
      - POSTGRES_USER=${POSTGRES_USER:-health_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal-network

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  worker_volume:
  valkey_data:
  qdrant_volume:
  postgres_data:
