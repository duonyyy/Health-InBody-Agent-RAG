version: '3.8'

networks:
  internal-network:
    name: internal-network
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
  valkey_data:
    name: ${VALKEY_VOLUME_NAME:-valkey_data}
  qdrant_volume:
    name: ${QDRANT_VOLUME_NAME:-qdrant_volume}

services:
  # 1. Cơ sở dữ liệu quan hệ lưu trữ thông tin người dùng, lịch sử chat, personalization & memory
  postgres-db:
    image: postgres:16-alpine
    hostname: postgres-db
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_inbody}
      POSTGRES_USER: ${POSTGRES_USER:-health_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-health_inbody}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Vector Database phục vụ lưu trữ embeddings BGE-M3 và truy xuất ngữ nghĩa (RAG)
  qdrant-db:
    image: qdrant/qdrant:latest
    hostname: qdrant-db
    container_name: qdrant-db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    volumes:
      - qdrant_volume:/qdrant/storage
      - ./qdrant/production.yaml:/qdrant/config/production.yaml:ro
    networks:
      - internal-network

  # 3. Cache tầng ứng dụng và Message Broker cho Celery
  valkey-db:
    image: valkey/valkey:bookworm
    hostname: valkey-db
    container_name: valkey-db
    restart: always
    ports:
      - "6379:6379"
    command: ["--save", "60", "1"]
    volumes:
      - valkey_data:/data
    networks:
      - internal-network

  # 4. Microservice phục vụ mô hình embedding BGE-M3
  embedding-api:
    image: nmk-health-embedding:cpu
    build:
      context: ./embed_serving
      dockerfile: Dockerfile.cpu-serving
    hostname: embedding-api
    container_name: health-embedding-api
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./embed_serving/models:/app/models
      - ./embed_serving/logs:/app/logs
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/models/bge-m3}
      API_HOST: 0.0.0.0
      API_PORT: 5000
      DEBUG: "false"
      MAX_BATCH_SIZE: 32
      ENCODE_BATCH_SIZE: 8
      EMBEDDING_DEVICE: cpu
      EMBEDDING_DTYPE: float32
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal-network
