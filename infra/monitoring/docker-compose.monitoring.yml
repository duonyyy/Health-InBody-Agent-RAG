version: '3.8'

networks:
  internal-network:
    name: internal-network
    external: true

volumes:
  langfuse_postgres_data:
    name: langfuse_postgres_data

services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse_secret}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - internal-network

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    restart: unless-stopped
    depends_on:
      - langfuse-db
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse_secret}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse_secret_salt_change_in_prod_1234}
      SALT: ${LANGFUSE_SALT:-langfuse_salt_change_in_prod_1234}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    networks:
      - internal-network
