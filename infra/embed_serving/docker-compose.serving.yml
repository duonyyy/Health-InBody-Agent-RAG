version: '3.8'

services:
  embedding-api:
    image: nmk-health-embedding:cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu-serving
    container_name: health-embedding-api
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env.serving
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
