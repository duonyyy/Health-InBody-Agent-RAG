version: "3.8"

networks:
  internal-network:
    name: internal-network
    external: true

services:
  chatbot-next-ui:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-production}
        NEXT_PUBLIC_DEV_USER_ID: ${NEXT_PUBLIC_DEV_USER_ID:-demo-user}
    hostname: chatbot-next-ui
    container_name: chatbot-next-ui
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT_BINDING:-127.0.0.1:3000}:3000"
    expose:
      - 3000
    networks:
      - internal-network
