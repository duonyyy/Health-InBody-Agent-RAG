[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inbody-ocr-paddle-service"
version = "1.0.0"
description = "Internal extraction-only OCR service for InBody reports using PaddleOCR and Text LLM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.6,<3",
    "requests>=2.31,<3",
    "pillow>=10,<12",
    "pdf2image>=1.17,<2",
    "numpy>=1.24,<2",
    "paddlepaddle>=2.6,<3; sys_platform != 'darwin'",
    "paddleocr>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
