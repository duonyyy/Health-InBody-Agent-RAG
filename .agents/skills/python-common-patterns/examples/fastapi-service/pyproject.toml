[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-patterns-fastapi-example"
version = "1.0.0"
description = "Tiny runnable FastAPI/SQLAlchemy patterns example"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
